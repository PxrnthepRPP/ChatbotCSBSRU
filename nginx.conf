# ==============================================================================
# BSRU Student Portal — Nginx Reverse Proxy Configuration
# ==============================================================================
# Mounted to /etc/nginx/conf.d/default.conf in the bsru_frontend container.
# Listens on port 80 inside container (mapped to host port 3000 in docker-compose).
# Routes static frontend assets and reverse proxies /api/ to Spring Boot backend.
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Set explicit UTF-8 character encoding for Thai text and ES6 modules
    charset utf-8;

    # Support up to 10MB client uploads (PDF petition attachments up to 5MB + multipart overhead)
    client_max_body_size 10M;

    # --------------------------------------------------------------------------
    # Frontend Static Assets & SPA Routing Fallback
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --------------------------------------------------------------------------
    # Reverse Proxy for Backend REST API
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Extended timeouts for AI Chatbot Gemini streaming & long-running RAG queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Disable buffering to allow real-time Server-Sent Events / chunked streaming
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # --------------------------------------------------------------------------
    # Error Page Handling
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
