name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Maven, JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      database:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: bsru_admin
          POSTGRES_PASSWORD: bsru_ci_password
          POSTGRES_DB: bsru_student_portal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bsru_admin -d bsru_student_portal"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # The application has no defaults for these; CI must provide them.
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/bsru_student_portal
      SPRING_DATASOURCE_USERNAME: bsru_admin
      SPRING_DATASOURCE_PASSWORD: bsru_ci_password
      PGVECTOR_HOST: localhost
      PGVECTOR_PORT: "5432"
      # Dummy signing key for tests only (>= 64 chars). Not a real secret.
      JWT_SECRET: ci-only-dummy-jwt-signing-key-for-automated-tests-not-a-secret-0123456789abcdef
      # GEMINI_API_KEY is intentionally NOT set so the chatbot runs in fallback mode.
      TZ: Asia/Bangkok

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven Wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Initialise database (pgvector extension)
        env:
          PGPASSWORD: bsru_ci_password
        run: psql -h localhost -U bsru_admin -d bsru_student_portal -v ON_ERROR_STOP=1 -f database/init.sql

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B test

  frontend:
    name: Frontend tests (Node)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # Static checks only (no live backend needed): API URL resolution, nginx/compose config,
      # frontend module layout and the official PDF form catalogue.
      - name: Run WP-7 frontend test
        run: node tests/test-wp7-frontend.mjs
