services:
  database:
    image: pgvector/pgvector:pg16
    container_name: bsru_vector_db
    restart: always
    environment:
      POSTGRES_USER: bsru_admin
      POSTGRES_PASSWORD: bsru_password
      POSTGRES_DB: bsru_student_portal
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsru_admin -d bsru_student_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
    driver: local
