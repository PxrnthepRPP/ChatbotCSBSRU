services:
  database:
    image: pgvector/pgvector:pg16
    container_name: bsru_vector_db
    restart: always
    environment:
      POSTGRES_USER: bsru_admin
      POSTGRES_PASSWORD: bsru_password
      POSTGRES_DB: bsru_student_portal
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsru_admin -d bsru_student_portal"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: bsru_backend
    restart: unless-stopped
    # อ่าน GEMINI_API_KEY, JWT_SECRET ฯลฯ จากไฟล์ .env (ไม่ถูก commit ขึ้น Git)
    # ไม่บังคับ: clone แล้วรันได้เลยโดยไม่มี .env (แชทบอทจะตอบแบบสำรองจนกว่าจะใส่ GEMINI_API_KEY)
    env_file:
      - path: .env
        required: false
    # ค่าด้านล่างทับค่าใน .env เพราะใน Docker ต้องเรียกฐานข้อมูลผ่านชื่อ service ไม่ใช่ localhost
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database:5432/bsru_student_portal
      PGVECTOR_HOST: database
      PGVECTOR_PORT: "5432"
      SERVER_PORT: "8080"
      # ช่วงเปิด/ปิดลงทะเบียนใช้เวลาไทย (ค่าเริ่มต้นของ container คือ UTC)
      TZ: Asia/Bangkok
    ports:
      - "8080:8080"
    volumes:
      - petition_uploads:/app/uploads
    depends_on:
      database:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: bsru_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
      - ./assets:/usr/share/nginx/html/assets:ro
      - ./uploads/forms:/usr/share/nginx/html/uploads/forms:ro
    depends_on:
      - backend

volumes:
  pg_data:
    driver: local
  petition_uploads:
    driver: local
