# ==========================================
# BSRU Student Portal - settings shared by every profile
# ==========================================
# Secrets (database password, JWT secret) have NO default: set them as environment
# variables (see .env.example). The app refuses to start when they are missing.
#
# Profiles:
#   dev  -> application-dev.properties  (SQL logging; start-backend.ps1 activates it)
#   prod -> application-prod.properties (docker-compose activates it)
#   none -> the safe values in this file (no SQL logging)
# ==========================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/bsru_student_portal}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:bsru_admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.port=${SERVER_PORT:8080}

# SQL logging is off by default (turned on by the dev profile)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT Security Configuration
# JWT_SECRET is required (at least 32 bytes). Generate one with: openssl rand -base64 64
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS: allowed origins, comma-separated (Spring origin patterns, e.g. https://*.bsru.ac.th)
# Empty = only localhost / 127.0.0.1 / private LAN (192.168.x.x, 10.x.x.x, 172.16-31.x.x)
app.cors.allowed-origins=${APP_CORS_ORIGINS:}

# Google Gemini & LangChain4j RAG Configuration
gemini.api.key=${GEMINI_API_KEY:demo-api-key}
gemini.model-name=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.embedding-model-name=gemini-embedding-001

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
